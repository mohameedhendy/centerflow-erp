spring:
  application:
    name: identity-service

  datasource:
    url: "jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${IDENTITY_DB_NAME:identity_db}"
    username: "${IDENTITY_DB_USER:identity_app}"
    password: "${IDENTITY_DB_PASSWORD}"

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

security:
  jwt:
    issuer: "${JWT_ISSUER:centerflow-identity}"
    audience: "${JWT_AUDIENCE:centerflow-api}"
    access-token-ttl: "${JWT_ACCESS_TOKEN_TTL:PT15M}"
    secret: "${JWT_SECRET}"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never