spring:
  application:
    name: identity-service

  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${IDENTITY_DB_NAME:identity_db}"
    username: "${IDENTITY_DB_USER:identity_app}"
    password: "${IDENTITY_DB_PASSWORD}"

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

security:
  jwt:
    issuer: "${JWT_ISSUER:centerflow-identity}"
    audience: "${JWT_AUDIENCE:centerflow-api}"
    access-token-ttl: "${JWT_ACCESS_TOKEN_TTL:PT15M}"
    refresh-token-ttl: "${JWT_REFRESH_TOKEN_TTL:PT168H}"
    secret: "${JWT_SECRET}"

  password-reset:
    token-ttl: "${PASSWORD_RESET_TOKEN_TTL:PT15M}"
    expose-token-in-response: "${PASSWORD_RESET_EXPOSE_TOKEN:false}"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  metrics:
    tags:
      application: "${spring.application.name}"