spring:
  datasource:
    url: "jdbc:h2:mem:identity_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password:

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

security:
  jwt:
    issuer: centerflow-identity-test
    audience: centerflow-api-test
    access-token-ttl: PT15M
    secret: test-jwt-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ