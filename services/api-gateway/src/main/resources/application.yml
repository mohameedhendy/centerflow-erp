spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: "${IDENTITY_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/v1/auth/**

            - id: academic-service
              uri: "${ACADEMIC_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/academic/**

security:
  jwt:
    issuer: "${JWT_ISSUER:centerflow-identity}"
    audience: "${JWT_AUDIENCE:centerflow-api}"
    secret: "${JWT_SECRET}"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never