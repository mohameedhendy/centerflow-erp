spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: "${IDENTITY_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/v1/auth/**

            - id: academic-service
              uri: "${ACADEMIC_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/v1/academic/**

            - id: enrollment-service
              uri: "${ENROLLMENT_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/api/v1/enrollments/**

            - id: finance-service
              uri: "${FINANCE_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/v1/finance/**

            - id: notification-service
              uri: "${NOTIFICATION_SERVICE_URL:http://localhost:8085}"
              predicates:
                - Path=/api/v1/notifications/**

security:
  jwt:
    issuer: "${JWT_ISSUER:centerflow-identity}"
    audience: "${JWT_AUDIENCE:centerflow-api}"
    secret: "${JWT_SECRET}"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  metrics:
    tags:
      application: "${spring.application.name}"