spring:
  application:
    name: finance-service

  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${FINANCE_DB_NAME:finance_db}"
    username: "${FINANCE_DB_USER:finance_app}"
    password: "${FINANCE_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jackson:
    time-zone: UTC

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never