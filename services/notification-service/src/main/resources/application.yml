server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: "${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/notification_db}"
    username: "${NOTIFICATION_DB_USERNAME:notification_app}"
    password: "${NOTIFICATION_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true