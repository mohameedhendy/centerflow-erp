server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${NOTIFICATION_DB_NAME:notification_db}"
    username: "${NOTIFICATION_DB_USER:notification_app}"
    password: "${NOTIFICATION_DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  metrics:
    tags:
      application: "${spring.application.name}"