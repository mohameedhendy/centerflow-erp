spring:
  application:
    name: enrollment-service

  datasource:
    url: "jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${ENROLLMENT_DB_NAME:enrollment_db}"
    username: "${ENROLLMENT_DB_USER:enrollment_app}"
    password: "${ENROLLMENT_DB_PASSWORD}"

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  jackson:
    time-zone: UTC

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  metrics:
    tags:
      application: "${spring.application.name}"